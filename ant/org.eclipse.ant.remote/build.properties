# The bundle only provides libraries for Ant builds running in a separate JVM:
# - lib/antdebug.jar: Ant debug support shared by the separate JVM and the Eclipse runtime (see loggers.jar in org.eclipse.ant.launching)
# - lib/remote.jar: Ant runner and loggers for the separate JVM
# - lib/remoteAnt.jar: input handler for the separate JVM
# The libraries are compiled with the bundle's BREE (JavaSE-17), see Bundle-RequiredExecutionEnvironment.
# Inside the IDE, the libraries are created by the "Build Remote Ant JARs" builder from the JDT output folders.
# The libraries must NOT be on the bundle class path: the Ant class loader asks the bundle class loader first,
# so classes loaded from there would be linked against the OSGi org.apache.ant bundle instead of the Ant runtime
# (LinkageError on BuildEvent). Therefore the manifest explicitly declares "Bundle-ClassPath: ." without a
# "source.." entry, otherwise PDE would add all output folders to the bundle class path when launching from the workspace.
source.lib/antdebug.jar = common/
output.lib/antdebug.jar = common_bin/
source.lib/remote.jar = remote/
output.lib/remote.jar = remote_bin/
source.lib/remoteAnt.jar = src/
output.lib/remoteAnt.jar = bin/
jars.compile.order = lib/antdebug.jar,\
                     lib/remote.jar,\
                     lib/remoteAnt.jar
bin.includes = META-INF/,\
               plugin.xml,\
               plugin.properties,\
               about.html,\
               lib/antdebug.jar,\
               lib/remote.jar,\
               lib/remoteAnt.jar
src.includes = about.html

# Maven properties, see https://github.com/eclipse/tycho/wiki/Tycho-Pomless
tycho.pomless.parent = ../../
pom.model.property.defaultSigning-excludeInnerJars = true
