# The bundle only provides lib/remoteAnt.jar for Ant builds running in a separate JVM.
# The library is compiled with the bundle's BREE (JavaSE-17), see Bundle-RequiredExecutionEnvironment.
# Inside the IDE, lib/remoteAnt.jar is created by the "Build Remote Ant JAR" builder from bin/.
source.lib/remoteAnt.jar = src/
output.lib/remoteAnt.jar = bin/
jars.compile.order = lib/remoteAnt.jar
bin.includes = META-INF/,\
               plugin.xml,\
               plugin.properties,\
               about.html,\
               lib/remoteAnt.jar
src.includes = about.html

# Maven properties, see https://github.com/eclipse/tycho/wiki/Tycho-Pomless
tycho.pomless.parent = ../../
pom.model.property.defaultSigning-excludeInnerJars = true
