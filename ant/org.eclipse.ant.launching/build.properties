source.. = src/                           
output.. = bin/
bin.includes = META-INF/,\
               .,\
               plugin.xml,\
               plugin.properties,\
               lib/loggers.jar,\
               about.html

jars.compile.order = .,\
				lib/loggers.jar
source.lib/loggers.jar = loggers/
output.lib/loggers.jar = loggers_bin/
# loggers.jar uses the Ant debug support classes from org.eclipse.ant.remote (both run in the Eclipse JVM)
extra.lib/loggers.jar = platform:/plugin/org.eclipse.ant.remote/lib/antdebug.jar
src.includes = about.html
javacWarnings..=-unavoidableGenericProblems

# Maven properties, see https://github.com/eclipse/tycho/wiki/Tycho-Pomless
tycho.pomless.parent = ../../
pom.model.property.defaultSigning-excludeInnerJars = true

# javadoc doesn't get the extra.lib/loggers.jar classpath (lib/antdebug.jar from org.eclipse.ant.remote),
# so skip the internal package of loggers.jar
pom.model.property.excludePackageNames = org.eclipse.ant.internal.launching.runtime.logger
